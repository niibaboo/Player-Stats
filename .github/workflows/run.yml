name: Update Player Stats
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: cache
          key: thestatsapi-cache-v1
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: python player_stat_model.py
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add player_stats_data.json docs/ cache -f || true
          git commit -m "manual update $(date +%Y-%m-%d)" || true
          git push
