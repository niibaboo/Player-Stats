name: Player Model

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # runs daily 6am
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install deps
        run: pip install requests pandas numpy
      
      - name: Run model
        env:
          THESTATSAPI_KEY: ${{ secrets.STATS_API_KEY }}
        run: |
          echo "2" | python player_stat_model.py
          mkdir -p docs
          touch docs/.nojekyll
          # whatever your script outputs, copy to docs/index.html
          if [ -f "player_stat_model.html" ]; then cp player_stat_model.html docs/index.html; fi
          if [ -f "index.html" ] && [ ! -f "docs/index.html" ]; then cp index.html docs/index.html; fi
          ls -lh docs/
      
      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
