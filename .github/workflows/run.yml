name: Player Stats Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'  # runs once a day at 7am UK - change or remove if you want

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: cache
          key: thestatsapi-cache-v1
          restore-keys: |
            thestatsapi-cache-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run model
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
        run: python player_stat_model.py

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/player_stats_data.json
          git diff --staged --quiet || git commit -m "update stats [skip ci]"
          git push
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
