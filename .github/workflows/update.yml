name: player stats update process
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests
      - name: Run model
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
        run: python player_stat_model.py
      - name: Save
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add docs/ player_stats_data.json -f || true
          git diff --staged --quiet || git commit -m "manual update [skip ci]"
          git push
