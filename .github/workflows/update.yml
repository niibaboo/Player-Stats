name: Update Player Stats

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate free stats
        run: python player_stat_model.py
      - name: Push JSON
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/player_stats_data.json
          git commit -m "free model - 0 API calls" || echo "no change"
          git push
