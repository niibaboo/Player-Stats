<!doctype html>
<html><head><meta name=viewport content="width=device-width,initial-scale=1"><title>Stats</title>
<style>body{background:#0f1a2a;color:#fff;font-family:sans-serif;padding:16px}.card{background:#14233a;padding:12px;margin:8px 0;border-radius:8px}</style>
</head><body>
<h2 id=s>LOADING</h2><div id=l></div>
<script>
document.getElementById('s').innerText='FETCHING';
fetch('https://niibaboo.github.io/Player-Stats/player_stats_data.json?'+Date.now())
.then(function(r){document.getElementById('s').innerText='STATUS '+r.status;return r.json()})
.then(function(d){
 var players=Object.values(d.players||{});
 document.getElementById('s').innerText=players.length+' PLAYERS OK';
 var h='';
 players.sort(function(a,b){return (b.expected_minutes||0)-(a.expected_minutes||0)}).forEach(function(p){
   var pr=p.props||{}; var ga=0; for(var k in pr){ if(k.indexOf('goal')>=0) ga=pr[k]; } if(!ga) ga=pr.goal_or_assist||0;
   h+='<div class=card><b>'+p.player_name+'</b> - '+p.team_name+' ('+p.expected_minutes+'m)<br>Shots:'+Math.round((pr.shots_over_1_5||pr.shots_over_1||0)*100)+'% SOT:'+Math.round((pr.sot_over_0_5||0)*100)+'% GA:'+Math.round(ga*100)+'%</div>';
 });
 document.getElementById('l').innerHTML=h;
}).catch(function(e){document.getElementById('s').innerText='FAIL '+e; document.getElementById('s').style.color='red'});
</script>
</body></html>
