<!doctype html>
<html><head><meta name=viewport content="width=device-width,initial-scale=1"><title>Player Stats</title>
<style>
body{background:#0f1a2a;color:#fff;font-family:-apple-system,sans-serif;padding:16px;margin:0}
.card{background:#14233a;padding:14px;margin:10px 0;border-radius:12px;border:1px solid #1e3a5a}
.badge{background:#1e4a7a;padding:2px 8px;border-radius:6px;font-size:12px}
</style></head><body>
<h2 style="text-align:center">⚽ 26 Players - FIXED ✅</h2>
<div id=list>Loading...</div>
<script>
fetch('https://niibaboo.github.io/Player-Stats/player_stats_data.json?'+Date.now())
.then(r=>r.json()).then(d=>{
  const players=Object.values(d.players||{}).sort((a,b)=>(b.expected_minutes||0)-(a.expected_minutes||0));
  let h='';
  players.forEach(p=>{
    const pr=p.props||{};
    const s15 = pr['shots_over_1.5']||pr.shots_over_1_5||0;
    const sot = pr['sot_over_0.5']||pr.sot_over_0_5||0;
    let ga=0; for(let k in pr){ if(k.includes('goal')) ga=pr[k]; }
    h+=`<div class=card><b>${p.player_name}</b> - ${p.team_name} <span class=badge>${p.expected_minutes}m</span><br>
    <span style="color:#8ab4ff">Over 1.5 Shots: ${Math.round(s15*100)}%</span> |
    SOT 0.5: ${Math.round(sot*100)}% |
    G/A: ${Math.round(ga*100)}%<br>
    <small>Pos: ${p.position} | Criteria: ${(p.criteria_hit||[]).join(', ')}</small></div>`;
  });
  document.getElementById('list').innerHTML=h;
});
</script>
</body></html>
