<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Stats LIVE</title>
<style>
body{font-family:system-ui;background:#0f1115;color:#fff;padding:12px}
.card{background:#1c1f26;border-radius:12px;padding:12px;margin:8px 0}
.small{opacity:.6;font-size:12px}
.badge{background:#2d5bff;padding:2px 8px;border-radius:20px;font-size:12px}
</style>
</head>
<body>
<h2 id="header">Loading...</h2>
<div id="list"></div>
<script>
fetch('./player_stats_data.json?v='+Date.now())
.then(r=>r.json())
.then(data=>{
  const players = Object.values(data.players||{});
  const teams = data.teams && data.teams.length>0? data.teams : [...new Set(players.map(p=>p.team_name))];
  document.getElementById('header').innerHTML = `${players.length} players LIVE | ${teams.length} teams | ${data.generated_at||''}`;

  document.getElementById('list').innerHTML = players.map(p=>{
    // skip fake identical stats
    const isFake = p.projected_per_match && p.projected_per_match.shots===0.75;
    return `<div class="card">
      <b>${p.player_name}</b> <span class="badge">${p.team_name}</span>
      <div class="small">${p.expected_minutes}' • ${p.season_minutes||p.matches_used||0} mins season • ${p.matches_used||0} games</div>
      <div>Shots O1.5: ${(p.props.shots_over_1_5||p.props.shots_over_1_5===0)? (p.props.shots_over_1_5*100).toFixed(0)+'%': ((p.props.shots_over_1_5||p.props['shots_over_1.5']||0)*100).toFixed(0)+'%'} ${isFake?'<span style="color:red">(FAKE DATA - API empty)</span>':''}</div>
      <div>SOT O0.5: ${((p.props.sot_over_0_5||p.props['sot_over_0.5']||0)*100).toFixed(0)}% • Card: ${((p.props.to_be_carded||0)*100).toFixed(0)}%</div>
      <div>Goal/Assist: ${((p.props.goal_or_assist||0)*100).toFixed(0)}%</div>
      <div class="small">proj: ${JSON.stringify(p.projected_per_match)}</div>
    </div>`;
  }).join('');
}).catch(e=>document.getElementById('header').innerText='Error: '+e+' - player_stats_data.json not found in docs/');
</script>
</body>
</html>
