<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Stat Model</title>
<style>
:root{--bg:#f5f2eb;--card:#162a44;--gold:#e9a840;--pill:#1a3a5a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,Inter,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.kicker{color:#2a9d8f;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
h1{margin:6px 0 8px;font-size:28px;color:#0f1a2a}.sub{color:#667085;font-size:14px;line-height:1.4;margin-bottom:16px}
.tabs{display:flex;gap:10px;margin:16px 0}
.tab{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;cursor:pointer}
.tab.active{background:var(--gold);color:#111}.tab.inactive{background:var(--card);color:#fff}
.filters{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.select{background:#fff;border:1px solid #d9cec0;padding:10px 12px;border-radius:10px;font-weight:600}
.section-title{font-size:13px;color:#98a2b3;margin:18px 0 8px}
.card{background:var(--card);color:#fff;border-radius:12px;padding:14px;margin:10px 0;border-left:4px solid var(--gold)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pill{background:var(--pill);border:1px solid #2a4a6a;color:#8ab4ff;padding:6px 10px;border-radius:999px;font-size:12px}
.row{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid #e5ddd0;font-size:14px;color:#0f1a2a}
.row b{color:#b7791f}
#status{font-size:12px;color:#667085}
</style>
</head>
<body>
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center"><span class="kicker">PLAYER PROPS</span><span id="status">loading</span></div>
<h1>Player Stat Model</h1>
<div class="sub">Blended last-10-match form and full-season rates, priced with a Poisson model for shots, cards, goals and assists.</div>

<div class="tabs">
<button id="tS" class="tab active" onclick="setTab('screener')">Screener</button>
<button id="tP" class="tab inactive" onclick="setTab('player')">Player</button>
</div>

<div class="filters">
<select id="teamFilter" class="select" onchange="render()"><option value="ALL">All Teams</option></select>
<select id="posFilter" class="select" onchange="render()"><option value="ALL">All Positions</option><option>FWD</option><option>MID</option><option>DEF</option><option>GK</option></select>
</div>

<div id="view-screener">
<div class="section-title">Scan — <span id="count">loading</span> players</div>
<div id="meets"></div>
<div id="lists"></div>
</div>
<div id="view-player" style="display:none"><div id="playerList"></div></div>
</div>

<script>
let ALL=[], TEAMS=new Set();
function safeVal(pr, keys){ for(let k of keys){ if(pr[k]!=null) return pr[k]; } for(let real in pr){ let norm=real.toLowerCase().replace(/[^a-z0-9]/g,''); for(let kk of keys){ if(norm===kk.toLowerCase().replace(/[^a-z0-9]/g,'')) return pr[real]; } } return 0; }
function pct(v){ return Math.round((v||0)*100); }
function setTab(t){ document.getElementById('tS').className='tab '+(t==='screener'?'active':'inactive'); document.getElementById('tP').className='tab '+(t==='player'?'active':'inactive'); document.getElementById('view-screener').style.display=t==='screener'?'block':'none'; document.getElementById('view-player').style.display=t==='player'?'block':'none'; }
function filtered(){ const tm=document.getElementById('teamFilter').value; const ps=document.getElementById('posFilter').value; return ALL.filter(p=>{ if(tm!=='ALL'&&p.team_name!==tm) return false; if(ps!=='ALL'&&(p.position||p.pos||'').toUpperCase().indexOf(ps)===-1) return false; return true; }); }

function render(){
 const players=filtered().sort((a,b)=>(b.expected_minutes||0)-(a.expected_minutes||0));
 document.getElementById('count').innerText=players.length+(document.getElementById('teamFilter').value!=='ALL'?' filtered':'');
 let meetsHtml='';
 players.slice(0,30).forEach(p=>{
   const pr=p.props||{}; const s15=safeVal(pr,['shots_over_1.5','shots_over_1_5']); const sot=safeVal(pr,['sot_over_0.5']); const ga=safeVal(pr,['goal_or_assist','goal or assist']); const card=safeVal(pr,['to_be_carded']);
   const pills=[]; if(pct(s15)>=5) pills.push(`Over 1.5 shots · ${pct(s15)}%`); if(pct(sot)>=5) pills.push(`Over 0.5 shots on target · ${pct(sot)}%`); if(pct(ga)>=5) pills.push(`Goal or assist · ${pct(ga)}%`); if(pct(card)>=5) pills.push(`To be carded · ${pct(card)}%`);
   if(!pills.length) return;
   meetsHtml+=`<div class="card"><b>${p.player_name}</b> <small style="opacity:.7">- ${p.team_name} ${p.expected_minutes}m</small><div class="pills">${pills.map(x=>`<span class="pill">${x}</span>`).join('')}</div></div>`;
 });
 document.getElementById('meets').innerHTML=meetsHtml||'<div class="section-title">No data for this filter</div>';
 let lists=''; function renderList(title, arr, key){ let h=`<div class="section-title">${title}</div>`; arr.slice(0,10).forEach((p,i)=>{ h+=`<div class="row"><span>${i+1} ${p.player_name} <small style="color:#98a2b3">${p.team_name}</small></span><b>${pct(safeVal(p.props||{},[key]))}.0%</b></div>` }); return h; }
 const byS15=[...players].sort((a,b)=>safeVal(b.props||{},['shots_over_1.5'])-safeVal(a.props||{},['shots_over_1.5']));
 const bySOT=[...players].sort((a,b)=>safeVal(b.props||{},['sot_over_0.5'])-safeVal(a.props||{},['sot_over_0.5']));
 lists+=renderList('Over 1.5 shots',byS15,'shots_over_1.5'); lists+=renderList('Over 0.5 shots on target',bySOT,'sot_over_0.5');
 document.getElementById('lists').innerHTML=lists;
 document.getElementById('playerList').innerHTML=players.map(p=>`<div class="card"><b>${p.player_name}</b> - ${p.team_name} ${p.expected_minutes}m<br><small>${p.position||p.pos||''}</small></div>`).join('');
}

fetch('https://niibaboo.github.io/Player-Stats/player_stats_data.json?'+Date.now()).then(r=>r.json()).then(d=>{
 ALL=Object.values(d.players||{}); ALL.forEach(p=>{ if(p.team_name) TEAMS.add(p.team_name); });
 const sel=document.getElementById('teamFilter'); [...TEAMS].sort().forEach(t=>{ const o=document.createElement('option'); o.value=t; o.textContent=t; sel.appendChild(o); });
 document.getElementById('status').innerText=ALL.length+' players LIVE ✅ | '+TEAMS.size+' teams';
 render();
});
</script>
</body>
</html>
