<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stats</title></head>
<body style="background:#0f1a2a;color:#fff;font-family:sans-serif;padding:16px">
<h2 id="status">Loading...</h2>
<div id="list"></div>
<script>
fetch('./player_stats_data.json?v='+Date.now()).then(r=>r.json()).then(d=>{
 document.getElementById('status').innerText=Object.keys(d.players).length+' players';
 let html='';
 Object.values(d.players).forEach(p=>{
   html+=`<div style="background:#14233a;padding:10px;margin:8px 0;border-radius:8px"><b>${p.player_name}</b> - ${p.team_name}<br>Shots 1.5: ${Math.round(p.props.shots_over_1.5*100)}% | SOT 0.5: ${Math.round(p.props.sot_over_0.5*100)}%</div>`;
 });
 document.getElementById('list').innerHTML=html;
}).catch(e=>{ document.getElementById('status').innerText='Error: '+e });
</script>
</body></html>
